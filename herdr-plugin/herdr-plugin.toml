id = "bhote.panel"
name = "Bhote Panel"
version = "0.5.8"
min_herdr_version = "0.8.2"
description = "Opens the Bhote side panel (topics + agents) on the right of every tab, about as wide as the herdr sidebar, when herdr starts"
platforms = ["macos", "linux"]

[[startup]]
command = ["sh", "open_panel.sh", "startup"]

[[events]]
on = "worktree.created"
command = ["sh", "open_panel.sh", "event"]

[[events]]
on = "pane.agent_status_changed"
command = ["sh", "on_event.sh"]

[[actions]]
id = "open"
title = "Bhote: open panel"
contexts = ["global"]
command = ["sh", "open_panel.sh", "open"]

[[actions]]
id = "dump"
title = "Bhote: topics for another machine"
contexts = ["global"]
command = ["sh", "dump.sh"]

[[actions]]
id = "focus"
title = "Bhote: jump to the panel and back"
contexts = ["global"]
command = ["sh", "focus.sh"]

[[actions]]
id = "changed"
title = "Bhote: another machine's agents changed"
contexts = ["global"]
command = ["sh", "changed.sh"]

[[actions]]
id = "search"
title = "Bhote: search and jump"
contexts = ["global"]
command = ["sh", "search_open.sh"]

[[panes]]
id = "search"
title = "bhote search"
placement = "popup"
width = "70%"
height = "70%"
command = ["sh", "search.sh"]
