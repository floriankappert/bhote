name: Tests

on:
  push:
    branches: [main, 'rust/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS, bash 3.2
            os: macos-latest
          - name: Linux, bash 5
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Use the system bash (3.2 on macOS, as on every Mac)
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && ln -sf /bin/bash "$RUNNER_TEMP/bin/bash"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Tools
        run: |
          bash --version | head -1
          jq --version && python3 --version && git --version
          git config --global user.name "bhote CI" && git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Build the daemon (its parity tests run when the binary is there, and it must compile on both systems)
        run: cargo build --release --manifest-path daemon/Cargo.toml
      - name: Unit tests of the daemon (input parser, child processes, guards)
        run: cargo test --release --manifest-path daemon/Cargo.toml
      - name: Test suites
        run: bash tests/run.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck (errors)
        run: |
          shellcheck --version | sed -n 2p
          shellcheck -S error bhote install.sh tests/*.sh tools/*.sh herdr-plugin/*.sh omarchy-plugin/*.sh

  daemon-checks:
    name: daemon (clippy, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: clippy (what is wrong, not what is style)
        run: cargo clippy --release --manifest-path daemon/Cargo.toml -- -A clippy::all -D clippy::correctness
      - name: known vulnerabilities in the dependencies
        run: cargo install cargo-audit --locked && cargo audit --file daemon/Cargo.lock
