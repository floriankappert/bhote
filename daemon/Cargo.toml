[package]
name = "bhoted"
version = "0.0.1"
edition = "2021"
description = "Prototype: bhote's topic index, built by a daemon instead of awk (same file format, std only)"

[profile.release]
opt-level = 3
lto = true
strip = true

[dependencies]
libc = "0.2.191"
serde_json = { version = "1", features = ["preserve_order"] }
unicode-width = "0.2.2"
ureq = "2"
vt100 = "0.18.1"
